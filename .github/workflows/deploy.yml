# Runs the tests, then uploads the project to HubSpot, on every push to main.
# Needs repository secrets HUBSPOT_ACCOUNT_ID and HUBSPOT_PERSONAL_ACCESS_KEY.
name: Test and deploy to HubSpot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hubspot-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DEFAULT_ACCOUNT_ID: ${{ secrets.HUBSPOT_ACCOUNT_ID }}
      DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: HubSpot/hubspot-project-actions@v1.1.0
